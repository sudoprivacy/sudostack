apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sessionsNamespace }}
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-controller
  namespace: {{ .Values.sessionsNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-controller
  namespace: {{ .Values.sessionsNamespace }}
subjects:
  - kind: ServiceAccount
    name: atlas-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: atlas-controller
  apiGroup: rbac.authorization.k8s.io
