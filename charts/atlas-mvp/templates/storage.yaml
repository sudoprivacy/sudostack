apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.dataSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-postgres-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.webui.databaseSize }}
