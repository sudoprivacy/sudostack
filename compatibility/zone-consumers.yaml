# Consumer support matrix for the zone-v1 contract family (§7.5 item 11).
# Documentation/CI input — not a runtime service-discovery mechanism.
#
# Generated-language status:
#   TypeScript  @sudo/contracts — P0 consumer: moss (pinned below)
#   Rust        sudo-contracts crate — P1a sudocode (step 08); built and
#               conformance-verified now, consumed when sudocode adopts it
#   Python      NOT distributed by sudostack — nexus derives owner-local
#               Pydantic adapters in-repo (no external Python consumer exists)
#   Go / C#     not generated — no formal consumer (regenerating empty
#               packages would be worse than none)
#   iam/v1      moss owner-local only — pinned in provenance for record
#               keeping, no public export derived

zone_v1:
  package: "@sudo/contracts@0.2.0-rc.1 (TS) / sudo-contracts@0.2.0-rc.1 (Rust)"
  owner_revisions:
    nexus_vfs: bc89aa638b6ebfa05ce9491fb6a2e0c841febe2c
    nexus: d78448594c7dd00d71581b62919ab0ca60cfedbb
    moss_metadata_only: 406427e280b55d04b5dbf097bd84da1194ace6e9
  families:
    common.sudo.dev/v1: [PrincipalRef, ResourceRef]
    auth.sudo.dev/v1: [Zone, ZoneCreateRequest, ZonePatchRequest, ZoneGrant, ZoneGrantCreateRequest, ZoneOperation, ErrorInfo, ZoneDelegation, ZoneDelegationIssueRequest, ZoneDelegationScopeRule]

consumers:
  moss:
    language: typescript
    pin: "github:sudoprivacy/sudostack#8323b0f6ac50270594dd76120919c20cc57318dd"
    pin_status: >-
      equivalence-judged: the moss consumption surface (contracts/zone-v1/
      derived artifacts) is byte-identical from 8323b0f through HEAD —
      generate inputs are unchanged, so regeneration does not alter them
      ("up to date" confirmed by the regeneration run). Kept at 8323b0f:
      the consumption surface has no functional difference to upgrade to.
    implementation_revision: 0bf6f4ff08fcf854f1b0f75d5e4f77d605736948
    consumes: { zone-id: [v0.1-shape], "common.sudo.dev/v1": [v1], "auth.sudo.dev/v1": [v1] }
  sudocode:
    language: rust
    pin: "pinned via nexus workspace (nexusd cohost-sudocode feature); alignment enforced by release matrix"
    pin_status: "cohost pin complete at 4740251c7f; nexus-vfs pin bc89aa638b6ebfa05ce9491fb6a2e0c841febe2c"
    consumes: { "common.sudo.dev/v1": [ResourceRef] }
  nexus:
    language: python-owner-local
    pin: "owner — no sudostack dependency by design"
    consumes: { "auth.sudo.dev/v1": [v1], "common.sudo.dev/v1": [v1] }
  sudowork:
    language: typescript
    pin: none
    pin_status: "future consumer"
    consumes: {}

compatibility:
  checker: compatibility/check-compatibility.mjs
  baseline: compatibility/baseline/ (snapshot of the released schemas)
  verdict_fixtures: contracts/zone-v1/fixtures/compatibility.gen.json
  first_release: "0.2.0-rc.1 is the first zone-v1 release — no previous minor exists; the baseline snapshot IS this release"
  zone_id_promise: "the only pre-existing consumer (moss @ 45304cf) consumes ./zone-id; compatibility for it is 'behavior unchanged' (see conformance suite)"

pin_alignment_gate:
  covered_now:
    - "sudostack derivation pin -> same compatible owner rev (provenance.gen.json)"
    - "Nexus source Cargo pin -> nexus-vfs exact rev (nexus source-lock.gen.json; single rev verified in nexus tests)"
    - "Moss @sudo/contracts pin -> derived package source manifest 8323b0f6ac50270594dd76120919c20cc57318dd (equivalence-judged, see consumers.moss)"
    - "sudocode nexus-vfs pin -> bc89aa638b6ebfa05ce9491fb6a2e0c841febe2c (cohost pin 4740251c7f)"
    - "Moss nexusd-cluster topology -> three-line machine-readable record below"
  deferred_to_step_10_assembly: []

nexus_runtime_topology:
  admin_plane:
    transport: "MOSS_NEXUS_V2_BASE_URL HTTP"
    nexus_commit: a8194cf444c0b35cc056ea8950f659135776a11f
    nexus_vfs_revision: bc89aa638b6ebfa05ce9491fb6a2e0c841febe2c
    status: aligned
  secrets_plane_embedded:
    runtime_version_pin: "0.1.6"
    observed_version: "nexusd-cluster 0.1.6 (nexus-cluster 0.1.1, plugin-abi 7)"
    binary_sha256: 466fdd50deba9000f4219387d58e7c24fb8f37a2701f3c530df1c28e2d628871
    binary_path: "moss/bin/nexus/nexusd.exe (git-ignored local artifact)"
    build_provenance: >-
      locally built from feat/contract-zone HEADs (nexus-vfs bc89aa638 for
      the daemon; vault cdylib from nexus a8194cf444), version stamped via
      NEXUSD_BUILD_VERSION=0.1.6, not distributed from any release source;
      vault plugin signed with a local Ed25519 key trusted through the
      kernel NEXUS_LOCAL_TRUSTED_KEYS_DIR DEV seam
    vault_plugin_sha256: 941892ccccf1eeb15590cf8e0c2577468ab88f95be1d39eec416a0dbb18c5c3d
    vault_plugin_abi: 7
    status: "converged locally: secrets plane built from the same source revisions as the admin plane (plugin-abi 7/7, drift resolved)"
  external_grpc:
    status: "unverified path"
