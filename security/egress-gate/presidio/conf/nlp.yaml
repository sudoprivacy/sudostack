# spaCy pipelines for the analyzer: English (the image's default) and
# Chinese. zh_core_web_lg's NER is OntoNotes-labelled, so the mapping below
# is the same table Presidio's own multilingual config uses.
nlp_engine_name: spacy
models:
  - lang_code: en
    model_name: en_core_web_lg
  - lang_code: zh
    model_name: zh_core_web_lg

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    NORP: NRP
    FAC: LOCATION
    LOC: LOCATION
    LOCATION: LOCATION
    GPE: LOCATION
    ORG: ORGANIZATION
    ORGANIZATION: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME

  low_confidence_score_multiplier: 0.4
  # Chinese customer organization names must reach the gate's 0.5 threshold.
  low_score_entity_names: []
