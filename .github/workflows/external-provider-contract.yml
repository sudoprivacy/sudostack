name: external-provider-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  external-provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - name: Read the exact experimental semantic source revision
        id: external-source
        run: node -e "const fs = require('node:fs'); const lock = JSON.parse(fs.readFileSync('contracts/experimental/external-provider/source.lock.json')); if (!/^[a-f0-9]{40}$/.test(lock.revision)) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + lock.revision + '\n')"
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/moss
          ref: ${{ steps.external-source.outputs.revision }}
          path: .external-owner/moss
          persist-credentials: false
      - name: Reproduce experimental generated bytes from the published Moss commit
        run: node contracts/experimental/external-provider/generate.mjs --owner .external-owner/moss --check
      - name: Reject source identity, revision and byte drift
        run: node --test contracts/experimental/external-provider/generate.test.mjs
      - run: npm ci --ignore-scripts
      - name: Check experimental TypeScript without changing the frozen package surface
        run: npx tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --types node contracts/experimental/external-provider/contract.gen.ts

