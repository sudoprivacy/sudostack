name: security acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluation-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public corpus adapters and disclosure scoring
        run: python3 -m unittest discover -s security/egress-gate/evaluation -v
      - name: Validate business protection and public-company exceptions
        run: python3 -m unittest discover -s security/egress-gate/presidio -v

  workspace-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse reused evidence before touching host resources
        run: |
          bash -n security/egress-gate/acceptance/run.sh
          bash security/egress-gate/acceptance/workspace-safety.sh
      - name: Failed resource creation cannot clean up existing resources
        run: python3 -m unittest discover -s security/egress-gate/acceptance -p 'test_business_wire*.py' -v
      - name: Managed session acceptance owns only successfully created units
        run: |
          python3 -m unittest discover -s security/egress-gate/acceptance -p 'test_managed_session*.py' -v
          node --check security/egress-gate/acceptance/managed-session.mjs

  chinese-analyzer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared Chinese analyzer
        run: docker build -t egress-analyzer:regression security/egress-gate/presidio
      - name: Chinese names pass the gate threshold; ordinary prose stays intact
        run: |
          set -euo pipefail
          cleanup() {
            docker logs --tail 80 egress-analyzer-regression || true
            docker inspect --format '{{json .State}}' egress-analyzer-regression || true
            docker rm -f egress-analyzer-regression >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for startup in $(seq 1 3); do
            docker run -d --name egress-analyzer-regression --memory=4g --cpus=2 \
              -p 127.0.0.1:59080:3000 egress-analyzer:regression
            is_ready=0
            for attempt in $(seq 1 60); do
              if curl --noproxy '*' --connect-timeout 1 --max-time 2 \
                --fail --silent http://127.0.0.1:59080/health >/dev/null; then
                is_ready=1
                break
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' egress-analyzer-regression)" != true ]; then
                exit 1
              fi
              sleep 1
            done
            if [ "$is_ready" != 1 ]; then
              docker top egress-analyzer-regression
              exit 1
            fi
            python3 security/egress-gate/acceptance/analyzer-regression.py
            docker exec egress-analyzer-regression test ! -e /app/gunicorn.ctl
            docker logs --tail 12 egress-analyzer-regression
            docker rm -f egress-analyzer-regression >/dev/null
          done
          docker run -d --name egress-analyzer-regression --memory=4g --cpus=2 \
            -p 127.0.0.1:59080:3000 \
            --mount type=bind,src="$PWD/security/egress-gate/acceptance/business-policy.fixture.json",dst=/app/conf-zh/business-policy.json,readonly \
            egress-analyzer:regression
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:59080/health >/dev/null; then break; fi
            sleep 1
          done
          python3 security/egress-gate/acceptance/business-analyzer.py
