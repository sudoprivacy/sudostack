name: security acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse reused evidence before touching host resources
        run: |
          bash -n security/egress-gate/acceptance/run.sh
          bash security/egress-gate/acceptance/workspace-safety.sh

  chinese-analyzer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared Chinese analyzer
        run: docker build -t egress-analyzer:regression security/egress-gate/presidio
      - name: Chinese names pass the gate threshold; ordinary prose stays intact
        run: |
          set -euo pipefail
          cleanup() {
            docker logs --tail 80 egress-analyzer-regression || true
            docker inspect --format '{{json .State}}' egress-analyzer-regression || true
            docker rm -f egress-analyzer-regression >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name egress-analyzer-regression --memory=4g --cpus=2 \
            -p 127.0.0.1:59080:3000 egress-analyzer:regression
          is_ready=0
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --connect-timeout 1 --max-time 2 \
              --fail --silent http://127.0.0.1:59080/health >/dev/null; then
              is_ready=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' egress-analyzer-regression)" != true ]; then
              exit 1
            fi
            sleep 1
          done
          if [ "$is_ready" != 1 ]; then
            docker logs egress-analyzer-regression
            exit 1
          fi
          python3 security/egress-gate/acceptance/analyzer-regression.py
