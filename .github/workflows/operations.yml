name: operations

on:
  pull_request:
    paths:
      - 'tools/operations/**'
      - '.github/workflows/operations.yml'
  push:
    branches: [main]
    paths:
      - 'tools/operations/**'
      - '.github/workflows/operations.yml'

jobs:
  compose-inspection:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/operations -p 'test_*.py'
