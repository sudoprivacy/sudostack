name: Cloud plan source

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cloud-plan-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - name: Published plan is generated from its single Markdown source
        run: node tools/docs/build-cloud-plan.mjs --check
