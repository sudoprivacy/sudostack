name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  candidate-offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Derived artifacts match the vendored exact-source bundle
        run: npm run generate:check-offline
      - name: Runtime, owner-fixture, source-lock, and compatibility tests
        run: npm test
      - name: Generated TypeScript declarations and sources type-check
        run: npm run typecheck
      - name: Candidate manifest digests and lifecycle are truthful
        run: npm run manifest:check
      - name: Post-activation consumer support is exact and bounded
        run: node tools/contracts/support.mjs
      - name: Candidate content revision matches immutable parent bytes
        run: node tools/contracts/activation.mjs
      - name: Packed artifact installs and imports from a clean directory
        run: npm run package:smoke

  owner-source-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci --ignore-scripts

      # This job intentionally fails while the exact owner commits are local-only.
      # Change the source lock to remote=available only after those same commits are
      # published; the verifier will then fetch and hash every immutable owner blob.
      - name: Exact owner revisions are remotely available
        run: npm run source:verify-remote
      - name: Exact Moss consumer revision, boundary, and checks are remotely verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/contracts/support.mjs --remote

  every-clause-names-what-enforces-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: The enforcement checker catches what it claims to
        run: node --test docs/adr/enforced-by.test.mjs
      - name: Every normative clause answers for itself
        run: node docs/adr/enforced-by.mjs
