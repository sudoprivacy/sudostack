name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  candidate-offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Derived artifacts match the vendored exact-source bundle
        run: npm run generate:check-offline
      - name: Runtime, owner-fixture, source-lock, and compatibility tests
        run: npm test
      - name: Immutable predecessor and content C pass only the bounded compatibility preflight
        run: node tools/contracts/successor-compatibility.mjs --previous 5a2a53130e37d1c63993ebf8ba1253b15eb9eebf --candidate 273fd4097cbc33c1c049c39bb1fb60cef2663e2b
      - name: B0 source template remains structurally valid and unapproved
        run: node tools/contracts/b0-preflight.mjs --template
      - name: Generated TypeScript declarations and sources type-check
        run: npm run typecheck
      - name: Staged candidate manifest, immutable baseline, and historical chain are truthful
        run: npm run manifest:check
      - name: Package-external 0.2.1 activation record and C bytes are internally consistent
        run: node tools/contracts/activation-0.2.1.mjs
      - name: Export and support accounting retains the known ResourceRef gap without admission
        run: node tools/contracts/export-support-audit.mjs
      - name: Historical 0.2.0 generation, tests, typecheck, activation, support, and package remain reproducible
        run: node tools/contracts/history-0.2.0.mjs --full
      - name: Packed artifacts are deterministic, exact-delta, installable, and importable
        run: npm run package:smoke

  owner-source-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci --ignore-scripts

      # Owner-source verification checks the exact published owner revisions. Historical
      # Moss support verification runs from the immutable 0.2.0 evidence checkout.
      - name: Exact owner revisions are remotely available
        run: npm run source:verify-remote
      - name: Exact historical Moss consumer revision, boundary, and checks are remotely verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/contracts/history-0.2.0.mjs --remote
      - name: Exact Candidate2 and Moss repin evidence are remotely verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/contracts/activation-0.2.1.mjs --remote

  every-clause-names-what-enforces-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - name: Check out exact nexus-vfs enforcement targets
        uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: 24f6730ec90fab8a035b2f5400ed313bda343fbe
          path: .enforcement/nexus-vfs
          persist-credentials: false

      - name: The enforcement checker catches what it claims to
        run: node --test docs/adr/enforced-by.test.mjs
      - name: ADR-005 coverage checker catches omissions and overclaims
        run: node --test docs/adr/adr005-coverage.test.mjs
      - name: ADR-005 clause ledger and generated view match the current source
        run: node docs/adr/adr005-coverage.mjs --check
      - name: Every normative clause answers for itself without baseline regressions
        env:
          SUDOSTACK_REPOS_ROOT: ${{ github.workspace }}/.enforcement
        run: node docs/adr/enforced-by.mjs --strict
