# Deployment spine — the env-agnostic component set + pinned versions.
# "What gets deployed", independent of target. Profiles reference these by id.
#
# Versions here are the single source of truth for a deployment; bumping a
# component = editing one line here, then redeploying every target. Exact
# release pins marked TODO are to be captured from the base-product release
# artifacts (they were placed by hand on the current SaaS VM).

runtime = { node = "22.23.2" }               # host node (moss-server runs on it)

[components.moss]
repo     = "sudoprivacy/moss"
role     = "control plane; hosts scode (ACP) + WS bridge; JWT/sessions/admin API"
source   = "git"                              # built from a checkout, not a release artifact
runtime  = "node"
entry    = "bin/moss-server.mjs"              # build output (run with node)
version  = "cf3b7e8"                          # git describe v0.0.3-472-gcf3b7e8d (live VM); pin = commit
port     = 43127

[components.nexus-broker]
repo     = "nexi-lab/nexus"                   # nexus is cross-org (per SSOT)
role     = "storage / identity (CA cert = agent-name) / secrets; cluster founder"
source   = "release-binary"                   # single static binary, placed on host
artifact = "nexusd-cluster-main"
version  = "0.1.1"                            # nexusd-cluster --version on the live VM
grpc_port = 2126
cluster_port = 8443

[components.scode]
repo     = "sudoprivacy/sudocode"
role     = "ACP agent engine (stdio), one per session; spawned/supervised by moss"
source   = "release-binary"                   # musl-static (zero glibc since v0.2.0)
artifact = "scode"
version  = "0.1.28"                           # scode --version on the live VM
install_path = "~/.local/bin/scode"

[components.webui]
repo    = "sudoprivacy/sudowork"              # apps/webui in the monorepo
role    = "multi-tenant browser admin console (optional; client-side, not on the SaaS VM today)"
artifact = "docker image (apps/webui/Dockerfile, monorepo build)"
version = "TODO"
port    = 26808

# Model egress is external and not deployed here:
#   scode --auth proxy → SudoRouter (nova-gateway) at sudorouter.ai
