<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="mA" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#6ea8fe"/></marker>
    <marker id="mG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#4ade80"/></marker>
  </defs>
  <style>.ln{fill:#7f93ab;font-size:11px;font-weight:700;}.bx{font-size:12.5px;font-weight:700;}.sm{font-size:10.5px;}.el{fill:#8aa0bb;font-size:10px;}</style>

  <!-- lane guides -->
  <text x="14" y="70" class="ln">入口</text>
  <text x="14" y="168" class="ln">中控·编排</text>
  <text x="14" y="262" class="ln">引擎</text>
  <text x="14" y="360" class="ln">出口</text>
  <text x="14" y="470" class="ln">基座</text>

  <!-- Lane1 入口 -->
  <g>
    <rect x="90" y="40" width="230" height="60" rx="9" fill="#22202f" stroke="#b48ce0"/>
    <text x="205" y="66" class="bx" fill="#e9ddf7" text-anchor="middle">SudoWork · 纯 UI</text>
    <text x="205" y="84" class="sm" fill="#a99bc0" text-anchor="middle">sudowork · 任务/Team/Trace</text>
    <rect x="340" y="40" width="270" height="60" rx="9" fill="#1c2733" stroke="#3b5a86"/>
    <text x="475" y="66" class="bx" fill="#cfe0f6" text-anchor="middle">IM Channels</text>
    <text x="475" y="84" class="sm" fill="#9fb0c3" text-anchor="middle">Telegram / Lark / 钉钉 / WeChat</text>
    <rect x="630" y="40" width="270" height="60" rx="9" fill="#1c2733" stroke="#3b5a86"/>
    <text x="765" y="66" class="bx" fill="#cfe0f6" text-anchor="middle">WebUI / 远程</text>
    <text x="765" y="84" class="sm" fill="#9fb0c3" text-anchor="middle">Express + WS · 自托管</text>
  </g>

  <!-- Lane2 中控·编排 -->
  <g>
    <rect x="90" y="140" width="250" height="58" rx="9" fill="#231f2e" stroke="#c9a6ef"/>
    <text x="215" y="164" class="bx" fill="#e9ddf7" text-anchor="middle">moss · 中控（给人用）</text>
    <text x="215" y="182" class="sm" fill="#a99bc0" text-anchor="middle">registry client · session UI · 派活</text>
    <rect x="360" y="140" width="250" height="58" rx="9" fill="#2a2620" stroke="#e0a94b"/>
    <text x="485" y="164" class="bx" fill="#f5e6c8" text-anchor="middle">hydra · 编排/调度</text>
    <text x="485" y="182" class="sm" fill="#c9bda0" text-anchor="middle">spawn agent · setup sessions · A2A</text>
    <rect x="630" y="140" width="270" height="58" rx="9" fill="#12191b" stroke="#3b7a52"/>
    <text x="765" y="164" class="bx" fill="#d7f5e1" text-anchor="middle">shareone · 协同/验收</text>
    <text x="765" y="182" class="sm" fill="#9fb0c3" text-anchor="middle">白板 · 评论 · 签名交付</text>
  </g>

  <!-- Lane3 引擎 -->
  <rect x="90" y="234" width="810" height="66" rx="10" fill="#16211a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="112" y="260" class="bx" fill="#d7f5e1">sudocode · Agent 引擎（Harness）</text>
  <text x="112" y="282" class="sm" fill="#9fb0c3">一次运行 = pid · session-id（--resume）· transcript.jsonl · tool loop · subagent · memory</text>
  <text x="770" y="272" class="sm" fill="#7f93ab" text-anchor="middle">SudoWork 内嵌此引擎</text>

  <!-- Lane4 出口 -->
  <g>
    <rect x="90" y="334" width="270" height="58" rx="9" fill="#1b2a3f" stroke="#6ea8fe"/>
    <text x="225" y="358" class="bx" fill="#dbe8fb" text-anchor="middle">nova-gateway · SudoRouter</text>
    <text x="225" y="376" class="sm" fill="#9fb0c3" text-anchor="middle">模型/工具/凭证出口 · 内网 DLP</text>
    <rect x="380" y="334" width="230" height="58" rx="9" fill="#1c2733" stroke="#3b5a86"/>
    <text x="495" y="358" class="bx" fill="#cfe0f6" text-anchor="middle">MCP Gateway</text>
    <text x="495" y="376" class="sm" fill="#9fb0c3" text-anchor="middle">工具暴露/策略</text>
    <rect x="630" y="334" width="270" height="58" rx="9" fill="#1c2733" stroke="#3b5a86"/>
    <text x="765" y="358" class="bx" fill="#cfe0f6" text-anchor="middle">Credential Broker</text>
    <text x="765" y="376" class="sm" fill="#9fb0c3" text-anchor="middle">短期凭证 · 委派身份</text>
  </g>

  <!-- Lane5 基座 nexus -->
  <rect x="90" y="426" width="810" height="150" rx="12" fill="#101a20" stroke="#5a86a8" stroke-width="1.6"/>
  <text x="112" y="450" class="bx" fill="#9fd0f0">nexus + nexus-vfs · 协作基座（nexi-lab，跨 org）</text>
  <g>
    <rect x="112" y="462" width="230" height="46" rx="8" fill="#16222b" stroke="#3b5a86"/>
    <text x="227" y="480" class="sm" fill="#cfe0f6" text-anchor="middle" font-weight="700">VFS 命名空间</text>
    <text x="227" y="498" class="sm" fill="#9fb0c3" text-anchor="middle">/agents /sessions /proc /tools</text>
    <rect x="356" y="462" width="250" height="46" rx="8" fill="#16222b" stroke="#3b5a86"/>
    <text x="481" y="480" class="sm" fill="#cfe0f6" text-anchor="middle" font-weight="700">identity（不可伪造）</text>
    <text x="481" y="498" class="sm" fill="#9fb0c3" text-anchor="middle">CA cert · nexus://agent/{name} = agent-name</text>
    <rect x="620" y="462" width="266" height="46" rx="8" fill="#16222b" stroke="#3b5a86"/>
    <text x="753" y="480" class="sm" fill="#cfe0f6" text-anchor="middle" font-weight="700">A2A stamp hook</text>
    <text x="753" y="498" class="sm" fill="#9fb0c3" text-anchor="middle">盖不可伪造 from · raft 复制 · 跨 CA 可验</text>
    <rect x="112" y="516" width="230" height="46" rx="8" fill="#16222b" stroke="#3b5a86"/>
    <text x="227" y="534" class="sm" fill="#cfe0f6" text-anchor="middle" font-weight="700">AgentRegistry / MAS</text>
    <text x="227" y="552" class="sm" fill="#9fb0c3" text-anchor="middle">pid FSM · start_session · 存储 SSOT</text>
    <rect x="356" y="516" width="250" height="46" rx="8" fill="#16222b" stroke="#3b5a86"/>
    <text x="481" y="534" class="sm" fill="#cfe0f6" text-anchor="middle" font-weight="700">vault · rebac · delegation</text>
    <text x="481" y="552" class="sm" fill="#9fb0c3" text-anchor="middle">秘钥 · 授权 · 委派</text>
    <rect x="620" y="516" width="266" height="46" rx="8" fill="#16222b" stroke="#3b5a86"/>
    <text x="753" y="534" class="sm" fill="#cfe0f6" text-anchor="middle" font-weight="700">sandbox</text>
    <text x="753" y="552" class="sm" fill="#9fb0c3" text-anchor="middle">seccomp/ns → gVisor（phase-2）</text>
  </g>

  <!-- edges -->
  <!-- SudoWork -> moss create task -->
  <line x1="205" y1="100" x2="215" y2="140" stroke="#6ea8fe" stroke-width="1.4" marker-end="url(#mA)"/>
  <text x="150" y="124" class="el">创建任务(TaskSpec)</text>
  <!-- channels -> moss -->
  <line x1="430" y1="100" x2="270" y2="140" stroke="#6ea8fe" stroke-width="1.2" marker-end="url(#mA)"/>
  <!-- moss -> hydra 派单 -->
  <line x1="340" y1="169" x2="360" y2="169" stroke="#6ea8fe" stroke-width="1.4" marker-end="url(#mA)"/>
  <text x="300" y="132" class="el">派单/编排</text>
  <!-- hydra -> sudocode spawn -->
  <line x1="485" y1="198" x2="470" y2="234" stroke="#6ea8fe" stroke-width="1.4" marker-end="url(#mA)"/>
  <text x="492" y="222" class="el">spawn agent (start_session)</text>
  <!-- sudocode -> shareone 交付 -->
  <line x1="765" y1="198" x2="765" y2="234" stroke="#4ade80" stroke-width="1.3" marker-end="url(#mG)"/>
  <text x="778" y="222" class="el">交付/验收</text>
  <!-- sudocode -> nova-gateway 出口 -->
  <line x1="300" y1="300" x2="255" y2="334" stroke="#6ea8fe" stroke-width="1.4" marker-end="url(#mA)"/>
  <text x="150" y="322" class="el">模型/工具/凭证出口</text>
  <!-- sudocode -> nexus VFS/a2a/MAS (routed through MCP/Credential gap x~620) -->
  <line x1="620" y1="300" x2="612" y2="426" stroke="#4ade80" stroke-width="1.6" marker-end="url(#mG)"/>
  <text x="470" y="414" class="el">VFS syscalls · A2A · MAS::start_session</text>
  <!-- nova-gateway -> nexus (creds/vault) -->
  <line x1="225" y1="392" x2="225" y2="426" stroke="#6ea8fe" stroke-width="1.1" marker-end="url(#mA)" stroke-dasharray="4 3"/>
  <!-- identity stamps agent (dashed up) -->
  <line x1="481" y1="462" x2="481" y2="300" stroke="#e0a94b" stroke-width="1.1" marker-end="url(#mA)" stroke-dasharray="3 4"/>
  <text x="150" y="414" class="el" fill="#c9bda0">identity=agent-name 贯穿全链</text>

  <text x="112" y="600" class="sm" fill="#7f93ab">Mega-product 组合：Atlas / SaaS = 上面全部模块的同源装配（部署形态不同）；SaaS 先在腾讯云跑通 → 企业交付同源到 Atlas；SudoEdge = 盒内含 Atlas + SudoWork（air-gap）。</text>
  <text x="112" y="620" class="sm" fill="#7f93ab">虚线=凭证/身份面；绿实线=引擎↔基座（存储/协作 SSOT 在 nexus）；蓝实线=任务/控制流。</text>
</svg>
