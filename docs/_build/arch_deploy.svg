<svg viewBox="0 0 1020 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="dA" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ea8fe"/></marker>
    <marker id="dG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e0a94b"/></marker>
  </defs>
  <style>.h{font-weight:700;}.sm{font-size:10.5px;fill:#9fb0c3;}.bx{font-size:12px;font-weight:700;}.mut{font-size:10px;fill:#7f93ab;}</style>

  <!-- Phase 1 arc: 本地 -> SaaS -->
  <path d="M170,66 C 360,14 760,14 852,66" fill="none" stroke="#e0a94b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dG)"/>
  <rect x="404" y="8" width="230" height="22" rx="11" fill="#2a2620" stroke="#e0a94b"/>
  <text x="519" y="23" fill="#f5e6c8" font-size="11.5" text-anchor="middle" class="h">Phase 1：先跑通 sudowork → sudosaas</text>

  <!-- Block 1 本地环境 -->
  <rect x="16" y="70" width="306" height="450" rx="13" fill="#191526" stroke="#b48ce0" stroke-width="1.6"/>
  <text x="34" y="96" fill="#e9ddf7" font-size="14" class="h">① 本地环境（个人端）</text>
  <text x="34" y="113" class="sm">管控：员工个人 · 断网可独立跑</text>
  <g>
    <rect x="30" y="126" width="278" height="52" rx="8" fill="#22202f" stroke="#8b6db0"/>
    <text x="169" y="147" fill="#e9ddf7" class="bx" text-anchor="middle">SudoWork · UI（sudowork）</text>
    <text x="169" y="166" class="sm" text-anchor="middle">人在环工作台 · 任务看板</text>
    <rect x="30" y="186" width="278" height="52" rx="8" fill="#16211a" stroke="#3b7a52"/>
    <text x="169" y="207" fill="#d7f5e1" class="bx" text-anchor="middle">sudocode · 内嵌 Harness 引擎</text>
    <text x="169" y="226" class="sm" text-anchor="middle">断网可独立跑通完整任务闭环</text>
    <rect x="30" y="246" width="278" height="52" rx="8" fill="#141b24" stroke="#3b5a86"/>
    <text x="169" y="267" fill="#cfe0f6" class="bx" text-anchor="middle">本机 Runtime</text>
    <text x="169" y="286" class="sm" text-anchor="middle">文件 / shell / browser / 本地凭证</text>
    <rect x="30" y="306" width="278" height="42" rx="8" fill="#0e1620" stroke="#2a3644"/>
    <text x="169" y="332" class="mut" text-anchor="middle" font-size="10.5">个人办公数据 · 不接核心业务数据</text>
  </g>
  <text x="34" y="372" class="mut">本地任务默认在此执行</text>

  <!-- Block 2 Sudo Atlas -->
  <rect x="346" y="70" width="330" height="450" rx="13" fill="#141d2b" stroke="#6ea8fe" stroke-width="1.6"/>
  <text x="364" y="96" fill="#dbe8fb" font-size="14" class="h">② Sudo Atlas（企业内网 · sudoatlas 🆕）</text>
  <text x="364" y="113" class="sm">部署两次：办公域（用户自管）/ 核心域（IT 管控）· 不分叉代码</text>
  <g>
    <rect x="360" y="126" width="302" height="50" rx="8" fill="#16222f" stroke="#3b5a86"/>
    <text x="511" y="146" fill="#cfe0f6" class="bx" text-anchor="middle">接入与任务</text>
    <text x="511" y="164" class="sm" text-anchor="middle">IM / API / 定时触发 · 任务队列 · 执行裁决</text>
    <rect x="360" y="184" width="302" height="50" rx="8" fill="#1b2430" stroke="#4a6ea0"/>
    <text x="511" y="204" fill="#cfe0f6" class="bx" text-anchor="middle">Agent 治理</text>
    <text x="511" y="222" class="sm" text-anchor="middle">注册中心 · 委派身份 ∩ 权限 · 审计/回滚闸门</text>
    <rect x="360" y="242" width="302" height="60" rx="8" fill="#16211a" stroke="#4ade80"/>
    <text x="511" y="262" fill="#d7f5e1" class="bx" text-anchor="middle">底座运行（容器）</text>
    <text x="511" y="280" class="sm" text-anchor="middle">sudocode 引擎 · moss 容器执行面 · hydra 编排</text>
    <text x="511" y="296" class="sm" text-anchor="middle">SudoRouter（nova-gateway）本域独占 Key</text>
    <rect x="360" y="310" width="302" height="44" rx="8" fill="#12191b" stroke="#3b7a52"/>
    <text x="511" y="337" fill="#9fd0c0" class="sm" text-anchor="middle">shareone 验收留痕 · trace 全量落盘（后训练）</text>
  </g>
  <text x="364" y="380" class="mut">云端任务在此执行 · 企业交付形态</text>

  <!-- Block 3 Sudo SaaS -->
  <rect x="700" y="70" width="304" height="450" rx="13" fill="#101a20" stroke="#4ade80" stroke-width="1.6"/>
  <text x="718" y="96" fill="#d7f5e1" font-size="14" class="h">③ Sudo SaaS（公有云 · sudosaas 🆕）</text>
  <text x="718" y="113" class="sm">数牍腾讯云 · 与 Atlas 同源「最强部署」</text>
  <g>
    <rect x="714" y="126" width="276" height="50" rx="8" fill="#13211b" stroke="#3b7a52"/>
    <text x="852" y="146" fill="#d7f5e1" class="bx" text-anchor="middle">服务端本体（Atlas 同源）</text>
    <text x="852" y="164" class="sm" text-anchor="middle">接入 · 任务 · Agent 管控治理</text>
    <rect x="714" y="184" width="276" height="50" rx="8" fill="#16211a" stroke="#4ade80"/>
    <text x="852" y="204" fill="#d7f5e1" class="bx" text-anchor="middle">hydra 编排/派单 · moss 容器执行面</text>
    <text x="852" y="222" class="sm" text-anchor="middle">跨域调度 · 执行状态汇聚</text>
    <rect x="714" y="242" width="276" height="60" rx="8" fill="#1a1420" stroke="#b48ce0"/>
    <text x="852" y="262" fill="#e9ddf7" class="bx" text-anchor="middle">sudoevolve 验收 · shareone 协同</text>
    <text x="852" y="280" class="sm" text-anchor="middle">sudochat 多租户（每租户一 worker）</text>
    <text x="852" y="296" class="sm" text-anchor="middle">Rubric 打分 · 失败模式归集</text>
    <rect x="714" y="310" width="276" height="44" rx="8" fill="#0e1620" stroke="#2a3644"/>
    <text x="852" y="337" class="mut" text-anchor="middle" font-size="10.5">三方接入 connectors · 更强模型 · C端/低敏</text>
  </g>
  <text x="718" y="380" class="mut">盒子交付后取出，在此迭代</text>

  <!-- inter-block arrows -->
  <line x1="322" y1="250" x2="346" y2="250" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#dA)"/>
  <text x="334" y="238" class="mut" text-anchor="middle" font-size="9.5">IM/定时</text>
  <text x="334" y="270" class="mut" text-anchor="middle" font-size="9.5">进 Atlas</text>
  <line x1="676" y1="240" x2="700" y2="240" stroke="#e0a94b" stroke-width="1.5" marker-end="url(#dG)"/>
  <line x1="700" y1="262" x2="676" y2="262" stroke="#e0a94b" stroke-width="1.5" marker-end="url(#dG)"/>
  <text x="688" y="228" class="mut" text-anchor="middle" font-size="9.5">同源代码</text>
  <text x="688" y="288" class="mut" text-anchor="middle" font-size="9">跨域信任边界</text>

  <!-- 域隔离 / 制品单向发布 note under Atlas -->
  <text x="511" y="404" class="mut" text-anchor="middle" font-size="10">跨域只允许制品单向发布（Agent 包/Skill/配置）· 数据不反向流动 · 核心域 trace 不出域</text>
  <text x="852" y="404" class="mut" text-anchor="middle" font-size="10">与内网之间只走脱敏产物</text>

  <!-- shared 底座 band -->
  <rect x="16" y="536" width="988" height="76" rx="12" fill="#0d1512" stroke="#3b7a52" stroke-width="1.6"/>
  <text x="34" y="562" fill="#4ade80" font-size="13.5" class="h">一份底座（三处同源二进制 · 逐格一致 · 责任人 Ethan）</text>
  <text x="34" y="584" class="sm">sudocode（Agent 引擎 · 会话循环/计划/工具裁决/子 Agent）　+　nexus + nexus-vfs（分布式 VFS · 身份=CA cert=agent-name 不可伪造 · A2A · 存储 SSOT · 跨 CA 信任边界）</text>
  <text x="34" y="602" class="mut">P1/P2/P6 共用；执行面只约定接口，实现按环境不同（本机进程 / 容器由 moss 承载），可互换不改 Harness 一行。</text>
  <!-- 底座 up-links to three blocks -->
  <line x1="169" y1="536" x2="169" y2="520" stroke="#4ade80" stroke-width="1.3" marker-end="url(#dA)" stroke-dasharray="3 3"/>
  <line x1="511" y1="536" x2="511" y2="520" stroke="#4ade80" stroke-width="1.3" marker-end="url(#dA)" stroke-dasharray="3 3"/>
  <line x1="852" y1="536" x2="852" y2="520" stroke="#4ade80" stroke-width="1.3" marker-end="url(#dA)" stroke-dasharray="3 3"/>
  <text x="519" y="528" class="mut" text-anchor="middle" font-size="10">同源二进制，向三处部署</text>
</svg>
