<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="aL" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6ea8fe"/></marker>
  </defs>
  <!-- Mega band -->
  <rect x="8" y="12" width="964" height="104" rx="14" fill="#141d2b" stroke="#3b5a86" stroke-width="1.5"/>
  <text x="26" y="36" fill="#6ea8fe" font-size="14" font-weight="700">Mega-product · 面向客户的组合</text>
  <text x="26" y="54" fill="#7f93ab" font-size="11.5">同源装配 · 部署形态不同</text>
  <g>
    <rect x="300" y="30" width="200" height="72" rx="10" fill="#1b2a3f" stroke="#6ea8fe" stroke-width="1.5"/>
    <text x="400" y="58" fill="#dbe8fb" font-size="15" font-weight="700" text-anchor="middle">Sudo Atlas</text>
    <text x="400" y="80" fill="#9fb0c3" font-size="11.5" text-anchor="middle">企业私有化 · 原 Server+MOSS 合并</text>
  </g>
  <g>
    <rect x="520" y="30" width="200" height="72" rx="10" fill="#1b2a3f" stroke="#6ea8fe" stroke-width="1.5"/>
    <text x="620" y="58" fill="#dbe8fb" font-size="15" font-weight="700" text-anchor="middle">Sudo SaaS</text>
    <text x="620" y="80" fill="#9fb0c3" font-size="11.5" text-anchor="middle">公有云 · Atlas 同源 + 编排脑</text>
  </g>
  <g>
    <rect x="740" y="30" width="216" height="72" rx="10" fill="#1b2a3f" stroke="#6ea8fe" stroke-width="1.5"/>
    <text x="848" y="58" fill="#dbe8fb" font-size="15" font-weight="700" text-anchor="middle">SudoEdge · 盒子</text>
    <text x="848" y="80" fill="#9fb0c3" font-size="11.5" text-anchor="middle">离线 · 盒内含 Atlas+SudoWork</text>
  </g>

  <!-- assembly connector -->
  <line x1="490" y1="116" x2="490" y2="150" stroke="#6ea8fe" stroke-width="1.6" marker-end="url(#aL)" stroke-dasharray="5 4"/>
  <rect x="404" y="122" width="172" height="24" rx="12" fill="#0b1017" stroke="#3b5a86"/>
  <text x="490" y="138" fill="#9fe0c0" font-size="11.5" text-anchor="middle">sudostack 装配（submodule）</text>

  <!-- UI + Agent set -->
  <g>
    <rect x="60" y="160" width="240" height="60" rx="10" fill="#22202f" stroke="#b48ce0" stroke-width="1.5"/>
    <text x="180" y="184" fill="#e9ddf7" font-size="14" font-weight="700" text-anchor="middle">SudoWork · 纯 UI</text>
    <text x="180" y="204" fill="#a99bc0" font-size="11.5" text-anchor="middle">repo: sudowork · Harness=sudocode</text>
  </g>
  <g>
    <rect x="680" y="160" width="276" height="60" rx="10" fill="#2a2620" stroke="#e0a94b" stroke-width="1.5"/>
    <text x="818" y="184" fill="#f5e6c8" font-size="14" font-weight="700" text-anchor="middle">SudoGenius · Agent 集</text>
    <text x="818" y="204" fill="#c9bda0" font-size="11.5" text-anchor="middle">领域包（本体/规则/资产/eval）</text>
  </g>

  <!-- Base band -->
  <rect x="8" y="244" width="964" height="214" rx="14" fill="#12191b" stroke="#3b7a52" stroke-width="1.5"/>
  <text x="26" y="268" fill="#4ade80" font-size="14" font-weight="700">Base product · 底层 repo（被 Mega 复用）</text>
  <text x="26" y="286" fill="#7f93ab" font-size="11.5">一次做好 · 处处复用 · 各自可独立演进</text>
  <g font-size="12.5" text-anchor="middle">
    <g><rect x="30" y="300" width="222" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="141" y="326" fill="#d7f5e1" font-weight="700">sudocode</text>
      <text x="141" y="348" fill="#9fb0c3" font-size="11">Agent 引擎 · Harness</text></g>
    <g><rect x="266" y="300" width="222" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="377" y="326" fill="#d7f5e1" font-weight="700">nexus + nexus-vfs</text>
      <text x="377" y="348" fill="#9fb0c3" font-size="11">协作基座/VFS · nexi-lab（跨 org）</text></g>
    <g><rect x="502" y="300" width="222" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="613" y="322" fill="#d7f5e1" font-weight="700">nova-gateway</text>
      <text x="613" y="342" fill="#9fb0c3" font-size="11">= SudoRouter · 模型路由</text>
      <text x="613" y="358" fill="#7f93ab" font-size="10">（非 sudorouter repo）</text></g>
    <g><rect x="738" y="300" width="218" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="847" y="326" fill="#d7f5e1" font-weight="700">moss</text>
      <text x="847" y="348" fill="#9fb0c3" font-size="11">中控（给人用）· registry/session</text></g>
    <g><rect x="30" y="378" width="222" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="141" y="404" fill="#d7f5e1" font-weight="700">hydra</text>
      <text x="141" y="426" fill="#9fb0c3" font-size="11">编排/调度 · spawn agent</text></g>
    <g><rect x="266" y="378" width="222" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="377" y="404" fill="#d7f5e1" font-weight="700">shareone</text>
      <text x="377" y="426" fill="#9fb0c3" font-size="11">协同白板 · 验收/签名</text></g>
    <g><rect x="502" y="378" width="222" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="613" y="404" fill="#d7f5e1" font-weight="700">ai-dev-browser</text>
      <text x="613" y="426" fill="#9fb0c3" font-size="11">网页探索/自动化</text></g>
    <g><rect x="738" y="378" width="218" height="66" rx="9" fill="#16211a" stroke="#3b7a52"/>
      <text x="847" y="404" fill="#d7f5e1" font-weight="700">password-agent</text>
      <text x="847" y="426" fill="#9fb0c3" font-size="11">凭证/秘钥 · vault</text></g>
  </g>
</svg>
